version: '3.8'

services:
  db:
    image: mysql:latest
    container_name: mysql-container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: nestdatabase
      MYSQL_DATABASE: nest_database

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
